name: CI

# Railway deploys through its own GitHub integration; this workflow proves every
# push to main builds and boots exactly like the Railway container will.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  container:
    name: Docker image & /healthz smoke test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    env:
      IMAGE: portfolio:ci
      PORT: 8080
    steps:
      - uses: actions/checkout@v4

      - name: Build image (same Dockerfile Railway uses)
        run: |
          docker build \
            --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} \
            --build-arg RAILWAY_ENVIRONMENT_NAME=ci \
            -t "$IMAGE" .

      - name: Boot container on $PORT
        run: docker run -d --name portfolio -p "$PORT:$PORT" -e PORT="$PORT" "$IMAGE"

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:$PORT/healthz"; then echo; exit 0; fi
            sleep 1
          done
          echo "healthz never became ready"; docker logs portfolio; exit 1

      - name: Smoke test routes, headers and compression
        run: |
          set -euo pipefail
          base="http://localhost:$PORT"

          body=$(curl -fsS "$base/healthz")
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q "\"port\":\"$PORT\""

          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/deep/link/route")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/assets/does-not-exist.js")" = 404

          asset=$(curl -fsS "$base/" | grep -o 'assets/index-[^"]*\.js' | head -n1)
          curl -fsS -D - -o /dev/null -H 'Accept-Encoding: gzip' "$base/$asset" | tee headers.txt
          grep -qi '^content-encoding: gzip' headers.txt
          grep -qi '^cache-control: public, max-age=31536000, immutable' headers.txt

      - name: Check NGINX startup
        run: |
          set -euo pipefail
          docker logs portfolio > out.log 2> err.log
          cat out.log
          grep -q "listeners* on port $PORT" out.log
          workers=$(docker exec portfolio sh -c 'ps | grep -c "[n]ginx: worker"')
          echo "worker processes: $workers"
          test "$workers" -le 4
          if [ -s err.log ]; then echo "unexpected stderr:"; cat err.log; exit 1; fi

      - name: Check IPv4 + IPv6 listeners (Railway private networking is IPv6)
        run: |
          set -euo pipefail
          docker exec portfolio netstat -ltn
          docker exec portfolio sh -c "netstat -ltn | grep -qE '0\.0\.0\.0:$PORT[[:space:]]'"
          if docker exec portfolio test -f /proc/net/if_inet6; then
            grep -q "IPv4 + IPv6 listeners on port $PORT" <(docker logs portfolio 2>/dev/null)
            docker exec portfolio sh -c "netstat -ltn | grep -qE ':::$PORT[[:space:]]'"
            docker exec portfolio wget -qO- "http://[::1]:$PORT/healthz"
            echo
            echo "IPv6 listener verified"
          else
            echo "IPv6 not available on this runner; IPv4-only path exercised"
          fi

      - name: Container logs
        if: always()
        run: docker logs portfolio || true
