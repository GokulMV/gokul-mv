# Security headers for every response. NGINX drops a server-level add_header
# in any location that sets its own, so each location includes this file.
#
# CSP: scripts only from this site; styles from this site (plus the inline
# styles the room is drawn with) and Google Fonts; fonts from Google Fonts;
# images from this site and data: URIs (the favicon and the wall's grain);
# fetches only to Open-Meteo, for the weather in the windows.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# "use my location" on the weather tag asks for geolocation on this site only
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
